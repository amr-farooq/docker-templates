name: Pipeline 1 - Build & Push to Internal Registry

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.github/workflows/pipeline1-build.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (default: git tag or commit sha)'
        required: false
        type: string

env:
  REGISTRY: registry.internal:5000
  ARTIFACT_RETENTION: 30  # days

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
    
    steps:
      # ========================================================================
      # CHECKOUT & SETUP
      # ========================================================================
      
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git info
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # ========================================================================
      # VERSION DETECTION
      # ========================================================================
      
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${{ github.sha }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "::notice::Building version: ${VERSION}"
      
      - name: Get git info
        id: git
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT
          echo "author=$(git log -1 --pretty=format:'%an')" >> $GITHUB_OUTPUT
      
      # ========================================================================
      # LOGIN TO INTERNAL REGISTRY
      # ========================================================================
      
      - name: Login to Internal Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.INTERNAL_REGISTRY_USER }}
          password: ${{ secrets.INTERNAL_REGISTRY_PASSWORD }}
      
      # ========================================================================
      # BUILD IMAGE
      # ========================================================================
      
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          registry: ${{ env.REGISTRY }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.event.repository.name }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.event.repository.name }}:latest
          labels: |
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.git.outputs.commit }}
            org.opencontainers.image.ref.name=${{ steps.git.outputs.branch }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.vendor=YourCompany
            pipeline=1-build
      
      - name: Image digest
        run: echo "Image digest: ${{ steps.build.outputs.digest }}"
      
      # ========================================================================
      # SECURITY: VERIFY NON-ROOT USER
      # ========================================================================
      
      - name: Verify non-root user
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ github.event.repository.name }}:${{ steps.version.outputs.version }} whoami | grep -v root || \
          (echo "::error::Container running as root!" && exit 1)
      
      # ========================================================================
      # SCAN: TRIVY
      # ========================================================================
      
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.event.repository.name }}:${{ steps.version.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'
      
      - name: Export Trivy results as JSON
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.event.repository.name }}:${{ steps.version.outputs.version }}
          format: 'json'
          output: 'trivy-report.json'
      
      - name: Check for CRITICAL vulnerabilities
        run: |
          CRITICAL=$(jq '[.Results[]? | select(.Severity=="CRITICAL") | .Vulnerabilities[]?] | length' trivy-report.json)
          if [[ ${CRITICAL} -gt 0 ]]; then
            echo "::error::Found ${CRITICAL} CRITICAL vulnerabilities"
            exit 1
          fi
          echo "::notice::No CRITICAL vulnerabilities found"
      
      # ========================================================================
      # GENERATE SBOM (Syft)
      # ========================================================================
      
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ github.event.repository.name }}:${{ steps.version.outputs.version }}
          format: json
          output-file: sbom-report.json
      
      # ========================================================================
      # INSTALL TOOLS
      # ========================================================================
      
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.0'
      
      # ========================================================================
      # SIGN IMAGE
      # ========================================================================
      
      - name: Sign image with Cosign
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign sign ${{ env.REGISTRY }}/${{ github.event.repository.name }}:${{ steps.version.outputs.version }}
          echo "::notice::Image signed successfully"
      
      # ========================================================================
      # CREATE BUILD ATTESTATION
      # ========================================================================
      
      - name: Create build attestation
        run: |
          cat > attestation.json << 'EOF'
          {
            "buildInfo": {
              "appName": "${{ github.event.repository.name }}",
              "version": "${{ steps.version.outputs.version }}",
              "buildDate": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
              "gitCommit": "${{ steps.git.outputs.commit }}",
              "gitBranch": "${{ steps.git.outputs.branch }}",
              "gitAuthor": "${{ steps.git.outputs.author }}",
              "imageTag": "${{ env.REGISTRY }}/${{ github.event.repository.name }}:${{ steps.version.outputs.version }}",
              "imageDigest": "${{ steps.build.outputs.digest }}",
              "builtBy": "GitHub Actions",
              "workflowRun": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "pipeline": "pipeline-1-build"
            },
            "security": {
              "nonRootUser": true,
              "multiStageBuild": true,
              "scanCompleted": true,
              "signed": true,
              "vulnerabilities": {
                "critical": 0,
                "high": 0
              }
            },
            "artifacts": {
              "trivyReport": "trivy-report.json",
              "sbom": "sbom-report.json",
              "attestation": "attestation.json"
            }
          }
          EOF
          cat attestation.json | jq '.'
      
      # ========================================================================
      # GENERATE CHECKSUMS
      # ========================================================================
      
      - name: Generate checksums
        run: |
          cat > checksums.txt << 'EOF'
          Application: ${{ github.event.repository.name }}
          Version: ${{ steps.version.outputs.version }}
          Build Date: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Git Commit: ${{ steps.git.outputs.commit }}
          Git Branch: ${{ steps.git.outputs.branch }}
          Git Author: ${{ steps.git.outputs.author }}
          Image Tag: ${{ env.REGISTRY }}/${{ github.event.repository.name }}:${{ steps.version.outputs.version }}
          Image Digest: ${{ steps.build.outputs.digest }}
          Built By: GitHub Actions (${{ github.actor }})
          Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Pipeline: 1-build
          EOF
          cat checksums.txt
      
      # ========================================================================
      # UPLOAD ARTIFACTS
      # ========================================================================
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ steps.version.outputs.version }}
          path: |
            trivy-report.json
            sbom-report.json
            attestation.json
            checksums.txt
          retention-days: ${{ env.ARTIFACT_RETENTION }}
      
      # ========================================================================
      # CREATE GITHUB RELEASE (for tags)
      # ========================================================================
      
      - name: Create Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cat > RELEASE_NOTES.md << 'EOF'
          # ${{ github.event.repository.name }} ${{ steps.version.outputs.version }}
          
          ## Build Information
          - **Built by:** GitHub Actions
          - **Commit:** [${{ steps.git.outputs.commit }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.git.outputs.commit }})
          - **Branch:** ${{ steps.git.outputs.branch }}
          - **Author:** ${{ steps.git.outputs.author }}
          
          ## Image Details
          - **Registry:** ${{ env.REGISTRY }}
          - **Image:** ${{ github.event.repository.name }}:${{ steps.version.outputs.version }}
          - **Digest:** ${{ steps.build.outputs.digest }}
          
          ## Security
          - ✅ Scanned with Trivy
          - ✅ Signed with Cosign
          - ✅ SBOM generated
          - ✅ No critical vulnerabilities
          
          ## Artifacts
          - `trivy-report.json` - Vulnerability scan
          - `sbom-report.json` - Software bill of materials
          - `attestation.json` - Build attestation
          - `checksums.txt` - Image checksums
          
          ## Next Step
          Run Pipeline 2 during deployment window:
          ```bash
          ./pipeline2-validate-deploy.sh ${{ github.event.repository.name }} ${{ steps.version.outputs.version }} ${{ env.REGISTRY }} acr
          ```
          EOF
      
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          body_path: RELEASE_NOTES.md
          files: |
            trivy-report.json
            sbom-report.json
            attestation.json
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # ========================================================================
      # NOTIFY
      # ========================================================================
      
      - name: Notify build complete
        run: |
          echo "::notice::Pipeline 1 Complete ✅"
          echo "Image: ${{ env.REGISTRY }}/${{ github.event.repository.name }}:${{ steps.version.outputs.version }}"
          echo "Artifacts uploaded for Pipeline 2"
          echo "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ============================================================================
  # SUMMARY
  # ============================================================================
  
  notify:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build
    if: always()
    
    steps:
      - name: Build Summary
        run: |
          echo "## Pipeline 1 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.build.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** ${{ needs.build.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** ${{ needs.build.outputs.image-digest }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- trivy-report.json" >> $GITHUB_STEP_SUMMARY
          echo "- sbom-report.json" >> $GITHUB_STEP_SUMMARY
          echo "- attestation.json" >> $GITHUB_STEP_SUMMARY
          echo "- checksums.txt" >> $GITHUB_STEP_SUMMARY
